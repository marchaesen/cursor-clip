<?xml version="1.0"?>
<!--
  Outline pin, vendored so the pinned/unpinned state looks the same on every
  desktop. Icon themes differ per environment (COSMIC inherits Pop, GNOME uses
  Adwaita, KDE ships Breeze) and the original lives in libadwaita's private
  resource bundle, so neither can be relied on at runtime.

  Source: adw-tab-unpin-symbolic.svg from libadwaita.
  Author: Jakub Steiner. Licence: CC0 1.0 (public domain dedication).
-->
